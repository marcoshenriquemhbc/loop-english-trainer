<!-- ===== BIBLIOTECA DE VÍDEOS — colar logo antes de </body> ===== -->
<style>
  .lib-save-btn{ height:44px; padding:0 18px; font-size:14px; margin-left:8px; }
  .lib-box{ margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:14px 14px 6px; }
  .lib-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .lib-head .field-label{ margin:0; }
  .lib-count{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); }
  .lib-empty{ color:var(--muted); font-size:13px; line-height:1.5; padding:6px 0 14px; }
  .lib-item{ display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .lib-item.active .lib-title{ color:var(--crimson); }
  .lib-thumb{ width:96px; aspect-ratio:16/9; object-fit:cover; border-radius:3px; background:#000; flex:none; cursor:pointer; }
  .lib-info{ flex:1 1 auto; min-width:0; }
  .lib-title{ font-size:14px; font-weight:500; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
  .lib-meta{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); margin-top:4px; }
  .lib-actions{ display:flex; gap:6px; flex:none; }
  .lib-actions button{ padding:8px 10px; font-size:12px; background:var(--surface-2); color:var(--text); border:1px solid var(--line); }
  .lib-actions button:hover{ border-color:var(--crimson); }
  .lib-actions .lib-open{ background:var(--crimson); border-color:var(--crimson); }
  @media (max-width:520px){
    .lib-item{ flex-wrap:wrap; }
    .lib-thumb{ width:84px; }
    .lib-actions{ width:100%; justify-content:flex-end; }
  }
</style>
<script>
(function(){
  const KEY = 'videoLibrary';
  const loadBtn = document.getElementById('loadYtBtn');
  const ytError = document.getElementById('ytError');
  let lib = [];

  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn-secondary lib-save-btn';
  saveBtn.textContent = '☆ Salvar na biblioteca';
  loadBtn.after(saveBtn);

  const box = document.createElement('div');
  box.className = 'lib-box';
  box.innerHTML = '<div class="lib-head"><span class="field-label">Meus vídeos em estudo</span><span class="lib-count" id="libCount"></span></div><div id="libList"></div>';
  ytError.after(box);
  const listEl = box.querySelector('#libList');
  const countEl = box.querySelector('#libCount');

  async function loadLib(){
    try{
      const r = await localDB.get(KEY);
      lib = r && r.value ? JSON.parse(r.value) : [];
      if(!Array.isArray(lib)) lib = [];
    }catch(e){ lib = []; }
    render();
  }
  function persist(){ return localDB.set(KEY, JSON.stringify(lib)); }

  async function fetchTitle(id){
    try{
      const res = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id));
      if(!res.ok) return '';
      const data = await res.json();
      return data.title || '';
    }catch(e){ return ''; }
  }

  async function saveCurrent(){
    const raw = document.getElementById('urlInput').value.trim();
    const id = extractVideoId(raw);
    if(!id){ alert('Cole um link válido do YouTube no campo antes de salvar.'); return; }
    const bs = parseInt(document.getElementById('blockSizeYt').value, 10) || 10;
    const existing = lib.find(v => v.id === id);
    if(existing){
      existing.blockSeconds = bs;
      existing.url = raw;
      await persist(); render();
      flash('Já estava salva — bloco atualizado');
      return;
    }
    const item = { id, url: raw, title: '', blockSeconds: bs, added: Date.now() };
    lib.unshift(item);
    await persist(); render();
    flash('Salvo!');
    const title = await fetchTitle(id);
    if(title){ item.title = title; await persist(); render(); }
  }

  function flash(msg){
    const old = saveBtn.textContent;
    saveBtn.textContent = '✓ ' + msg;
    setTimeout(() => { saveBtn.textContent = old; }, 1600);
  }

  function openItem(item){
    document.querySelector('.tab-btn[data-tab="youtube"]').click();
    loadYoutubeVideo(item.url, item.blockSeconds || 10);
    render();
    setTimeout(() => document.getElementById('playerShell').scrollIntoView({ behavior:'smooth', block:'start' }), 350);
  }

  async function renameItem(item){
    const n = prompt('Nome do vídeo:', item.title || '');
    if(n === null) return;
    item.title = n.trim();
    await persist(); render();
  }

  async function removeItem(item){
    if(!confirm('Tirar "' + (item.title || item.id) + '" da biblioteca?\n(Suas anotações e o tempo estudado continuam guardados.)')) return;
    lib = lib.filter(v => v.id !== item.id);
    await persist(); render();
  }

  function render(){
    countEl.textContent = lib.length ? lib.length + (lib.length === 1 ? ' vídeo' : ' vídeos') : '';
    if(!lib.length){
      listEl.innerHTML = '<div class="lib-empty">Nenhum vídeo salvo ainda. Cole um link acima e toque em “Salvar na biblioteca”.</div>';
      return;
    }
    listEl.innerHTML = '';
    lib.forEach(item => {
      const row = document.createElement('div');
      row.className = 'lib-item' + (typeof currentKey !== 'undefined' && currentKey === item.id ? ' active' : '');
      row.innerHTML =
        '<img class="lib-thumb" loading="lazy" alt="" src="https://i.ytimg.com/vi/' + item.id + '/mqdefault.jpg">' +
        '<div class="lib-info"><div class="lib-title">' + escapeHtml(item.title || 'Vídeo ' + item.id) + '</div>' +
        '<div class="lib-meta">bloco ' + item.blockSeconds + 's · <span class="lib-time">—</span></div></div>' +
        '<div class="lib-actions"><button class="lib-open">Abrir</button><button class="lib-ren" title="Renomear">✎</button><button class="lib-del" title="Remover">✕</button></div>';
      row.querySelector('.lib-open').onclick = () => openItem(item);
      row.querySelector('.lib-thumb').onclick = () => openItem(item);
      row.querySelector('.lib-title').onclick = () => openItem(item);
      row.querySelector('.lib-ren').onclick = () => renameItem(item);
      row.querySelector('.lib-del').onclick = () => removeItem(item);
      listEl.appendChild(row);
      localDB.get('studytime:' + item.id).then(r => {
        const s = r && r.value ? parseFloat(r.value) : 0;
        row.querySelector('.lib-time').textContent = s > 0 ? fmt(s) + ' estudados' : 'ainda não estudado';
      });
    });
  }

  saveBtn.addEventListener('click', saveCurrent);
  loadBtn.addEventListener('click', () => setTimeout(render, 400));
  loadLib();
})();
</script>
<!-- ===== FIM DA BIBLIOTECA DE VÍDEOS ===== -->
